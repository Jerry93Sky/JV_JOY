name: JV independent engine checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/jv-calculation-engine
      - feature/jv-order-calculation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: JV unit and Excel-fixture tests
        run: pnpm test:jv
      - name: Shared TypeScript typecheck
        run: pnpm typecheck:shared
      - name: Frontend production build
        run: pnpm build:frontend
      - name: JV-Line Lab component smoke test
        run: pnpm smoke:jv-line-lab
      - name: Validate versioned JV JSON fixtures
        run: pnpm validate:jv-fixtures
