name: JV independent engine checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/jv-calculation-engine
      - feature/jv-order-calculation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: JV unit and Excel-fixture tests
        run: pnpm test:jv
      - name: Compare Front commercial Excel captures
        run: node --experimental-strip-types tools/jv/compare-front-commercial-r1.mjs
      - name: Compare independent F28 and B26 Excel scenarios
        run: |
          node --experimental-strip-types tools/jv/compare-unified-order-f28-2.mjs
          node --experimental-strip-types tools/jv/compare-front-slot7-b26-r2.mjs
      - name: Compare Front door Excel scenarios
        run: node --experimental-strip-types tools/jv/compare-front-door-all-seven.mjs
      - name: Shared TypeScript typecheck
        run: pnpm typecheck:shared
      - name: Frontend production build
        run: pnpm build:frontend
      - name: JV-Line Lab component smoke test
        run: pnpm smoke:jv-line-lab
      - name: Validate versioned JV JSON fixtures
        run: pnpm validate:jv-fixtures
      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate
      - name: JV backend API integration tests
        run: pnpm --filter backend test:jv-api
      - name: JV order UI and HTTP integration
        run: pnpm --filter frontend test:jv-order
      - name: JV order browser end-to-end
        run: pnpm --filter frontend test:jv-browser
