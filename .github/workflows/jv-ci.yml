name: JV independent engine checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/jv-calculation-engine
      - feature/jv-order-calculation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: JV unit and Excel-fixture tests
        run: pnpm test:jv
      - name: Compare Front commercial Excel captures
        run: node --experimental-strip-types tools/jv/compare-front-commercial-r1.mjs
      - name: Compare independent F28 and B26 Excel scenarios
        run: |
          node --experimental-strip-types tools/jv/compare-unified-order-f28-2.mjs
          node --experimental-strip-types tools/jv/compare-front-slot7-b26-r2.mjs
      - name: Compare Front door Excel scenarios
        run: node --experimental-strip-types tools/jv/compare-front-door-all-seven.mjs
      - name: Shared TypeScript typecheck
        run: pnpm typecheck:shared
      - name: Proposal money display test
        run: node --experimental-strip-types --test apps/frontend/scripts/proposalMoney.test.mjs
      - name: Frontend production build
        run: pnpm build:frontend
      - name: JV-Line Lab component smoke test
        run: pnpm smoke:jv-line-lab
      - name: Validate versioned JV JSON fixtures
        run: pnpm validate:jv-fixtures
      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate
      - name: Backend production build
        run: pnpm build:backend
      - name: JV backend API integration tests
        run: pnpm --filter backend test:jv-api
      - name: User role escalation protection
        run: pnpm --filter backend exec tsx --test test/jv/userRoleSecurity.test.ts
      - name: Deal system data preservation
        run: pnpm --filter backend exec tsx --test test/jv/dealSystemSafety.test.ts
      - name: JV order UI and HTTP integration
        run: pnpm --filter frontend exec node scripts/test-jv-order-integration.mjs
      - name: JV order browser end-to-end
        run: pnpm --filter frontend exec node scripts/test-jv-order-browser.mjs
      - name: R3 row editing browser checks (isolated fixtures)
        run: pnpm --filter frontend exec node scripts/r3-row-edit-check.mjs

      - name: Capture isolated page error states
        run: pnpm --filter frontend exec node scripts/audit-jv-pages.mjs
      - name: Capture filled test fixtures
        run: pnpm --filter frontend exec node scripts/audit-filled-pages.mjs
      - name: Package the tested frontend and backend
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: node tools/ci/package-main-build.mjs "$RUNNER_TEMP/jv-build"
      - name: Upload build candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: jv-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/jv-build/
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jv-ux-screenshots
          path: |
            test-results/jv-ux/*.png
            test-results/jv-ux-audit/*.png
            test-results/jv-ux-audit/audit.json
            test-results/jv-filled-audit/*.png
            test-results/jv-filled-audit/filled-audit.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jvtest
          POSTGRES_PASSWORD: jvtest-only
          POSTGRES_DB: jvtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jvtest -d jvtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jvtest:jvtest-only@127.0.0.1:5432/jvtest?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm --filter backend exec prisma migrate deploy
      - run: pnpm --filter @bms/shared build
      - run: pnpm --filter backend exec tsx --test test/jv/jvOrdersPostgres.test.ts test/jv/jvOrdersR42Postgres.test.ts test/jv/jvCalculationSnapshotPostgres.test.ts test/jv/jvProposalDraftPostgres.test.ts test/jv/jvProposalIssuancePostgres.test.ts
      - name: JV order, proposal and invoice draft workflow in Chrome
        env:
          PORT: '3318'
          JWT_SECRET: jv-print-ci-only
          ADMIN_INITIAL_PASSWORD: jv-print-ci-only
          JV_TEST_PASSWORD: jv-print-ci-only
        run: |
          pnpm --filter backend build
          pnpm --filter backend db:seed
          mkdir -p apps/frontend/dist
          backend_log="$RUNNER_TEMP/jv-print-backend.log"
          pushd apps/backend
          node dist/apps/backend/src/index.js >"$backend_log" 2>&1 &
          server=$!
          popd
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --silent --retry 20 --retry-connrefused --retry-delay 1 --output /dev/null "http://127.0.0.1:$PORT/api/jv/orders/form-config?profile=COMPLETATION"
          pnpm --filter frontend exec node scripts/test-jv-glass-off-proposal.mjs

  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [jv, persistence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download build from the same run
        uses: actions/download-artifact@v4
        with:
          name: jv-candidate-${{ github.sha }}
          path: verified-build
      - name: Verify checkout identity and record successful checks
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs'
          const manifest = readFileSync('verified-build/build-info.json', 'utf8')
          const { sha, runId, ref, builtAt } = JSON.parse(manifest)
          if (sha !== process.env.GITHUB_SHA || runId !== process.env.GITHUB_RUN_ID || ref !== 'refs/heads/main' ||
              manifest !== readFileSync('verified-build/apps/frontend/dist/build-info.json', 'utf8')) {
            throw new Error('The artifact does not match this main run')
          }
          writeFileSync('verified-build/verification.json', JSON.stringify({
            sha, runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT, builtAt,
            verifiedAt: new Date().toISOString(), checks: ['jv', 'persistence'],
          }, null, 2) + '\n')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Проверенная тестовая сборка\n\nАртефакт: jv-main-${sha}\n\nСобрана: ${builtAt}\n`)
          NODE
      - name: Publish the verified main build
        uses: actions/upload-artifact@v4
        with:
          name: jv-main-${{ github.sha }}
          path: verified-build/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
